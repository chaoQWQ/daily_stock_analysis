name: Telegram 频道监听

on:
  # 定时触发 - 每 6 小时重启一次（UTC 时间）
  schedule:
    - cron: '0 0,6,12,18 * * *'  # 每天 0:00, 6:00, 12:00, 18:00 UTC

  # 手动触发
  workflow_dispatch:
    inputs:
      summary_interval:
        description: '汇总推送间隔（分钟）'
        required: false
        default: '60'
        type: string
      debug:
        description: '调试模式'
        required: false
        default: false
        type: boolean

# 确保同时只有一个实例运行
concurrency:
  group: telegram-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    # 运行 5.5 小时后自动停止（留余量给下次启动）
    timeout-minutes: 330

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建必要目录
        run: |
          mkdir -p data/telegram logs reports

      - name: 启动 Telegram 监听
        env:
          # Telegram 配置
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_CHANNELS: ${{ secrets.TELEGRAM_CHANNELS }}
          TELEGRAM_ENABLED: 'true'
          TELEGRAM_SUMMARY_INTERVAL: ${{ github.event.inputs.summary_interval || '60' }}

          # Gemini AI（用于分析消息影响）
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
          GEMINI_REQUEST_DELAY: '3.0'

          # 企业微信推送
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}

          # 邮件推送
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_SERVER: 'smtp.qq.com'
          SMTP_PORT: '465'

          # 其他配置
          LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'DEBUG' || 'INFO' }}
        run: |
          echo "==========================================="
          echo "Telegram 频道监听"
          echo "==========================================="
          echo "汇总间隔: $TELEGRAM_SUMMARY_INTERVAL 分钟"
          echo "时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "==========================================="

          # 检查必要配置
          if [ -z "$TELEGRAM_SESSION" ]; then
            echo "❌ 错误: TELEGRAM_SESSION 未配置"
            echo "请先在本地运行 python generate_telegram_session.py 生成 Session"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHANNELS" ]; then
            echo "❌ 错误: TELEGRAM_CHANNELS 未配置"
            exit 1
          fi

          # 启动监听
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then
            python main.py --telegram-monitor --telegram-summary $TELEGRAM_SUMMARY_INTERVAL --debug
          else
            python main.py --telegram-monitor --telegram-summary $TELEGRAM_SUMMARY_INTERVAL
          fi

      - name: 上传日志
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-monitor-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
