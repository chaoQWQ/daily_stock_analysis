name: 早盘策略分析

on:
  schedule:
    - cron: '0 2 * * 1-5'
  workflow_dispatch:  # 支持手动触发

jobs:
  morning_strategy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许提交代码（如果需要保存报告）
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Morning Strategy
      env:
       # Gemini AI
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
        GEMINI_MODEL_FALLBACK: ${{ secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
        GEMINI_REQUEST_DELAY: '3.0'  # GitHub Actions 建议增加延时
        
        # 数据源 (可选)
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        
        # 搜索服务
        TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
        SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
        
        # 邮件配置
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_RECEIVER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        # 自选股列表 (从 secrets 或使用默认值)
        STOCK_LIST: ${{ secrets.STOCK_LIST || '600519' }}
        
        # 其他配置
        LOG_LEVEL: INFO
        DATA_DAYS: 60
        MAX_CONCURRENT: 3
        # 系统配置
        TZ: Asia/Shanghai
      run: |
        python main.py --morning
